<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BK-Lite 技术文档阅读</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f8fa; --panel: #ffffff; --text: #1f2328; --muted: #59636e;
    --border: #d1d9e0; --accent: #0969da; --code-bg: #f6f8fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --panel: #151b23; --text: #f0f6fc; --muted: #9198a1;
      --border: #3d444d; --accent: #4493f8; --code-bg: #1c2129;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.7;
  }
  .topbar {
    position: sticky; top: 0; z-index: 10; background: var(--panel);
    border-bottom: 1px solid var(--border); padding: .7rem 1.2rem;
    display: flex; align-items: center; gap: 1rem;
  }
  .topbar a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .topbar .doc-title { color: var(--muted); font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  main { max-width: 880px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  .md-body img { max-width: 100%; border-radius: 8px; border: 1px solid var(--border); }
  .md-body h1 { font-size: 1.7rem; letter-spacing: -0.02em; border-bottom: 1px solid var(--border); padding-bottom: .5rem; }
  .md-body h2 { font-size: 1.3rem; margin-top: 2rem; border-bottom: 1px solid var(--border); padding-bottom: .35rem; }
  .md-body h3 { font-size: 1.1rem; margin-top: 1.5rem; }
  .md-body code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .88em; background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 5px; padding: .1em .35em;
  }
  .md-body pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; overflow-x: auto; }
  .md-body pre code { background: none; border: none; padding: 0; font-size: .85em; }
  .md-body table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
  .md-body th, .md-body td { border: 1px solid var(--border); padding: .45rem .7rem; text-align: left; }
  .md-body th { background: var(--code-bg); }
  .md-body blockquote { margin: 1rem 0; padding: .2rem 1rem; border-left: 3px solid var(--accent); color: var(--muted); }
  .md-body a { color: var(--accent); }
  .md-body hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
  .loading, .error { color: var(--muted); padding: 3rem 0; text-align: center; }
  .error { color: #cf222e; }
  @media (prefers-color-scheme: dark) { .error { color: #f85149; } }
</style>
</head>
<body>
<div class="topbar">
  <a href="./index.html">← 返回图集首页</a>
  <span class="doc-title" id="doc-title">加载中…</span>
</div>
<main><div id="content" class="loading">正在加载文档…</div></main>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const doc = params.get('doc') || '';
  const el = document.getElementById('content');
  const titleEl = document.getElementById('doc-title');
  if (!doc || !/^[\w./-]+\.md$/.test(doc)) {
    el.className = 'error'; el.textContent = '未指定有效文档。请从首页目录进入。'; return;
  }
  try {
    const res = await fetch(doc);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const md = await res.text();
    const dir = doc.includes('/') ? doc.slice(0, doc.lastIndexOf('/') + 1) : '';
    // 正文内相对图片/链接补全到 docs/ 目录；外链与锚点不动
    md = md.replace(/(!\[[^\]]*\]\()(\.\/)?(?!https?:|#)([^)]+)\)/g, (m, pre, dot, path) => pre + dir + path + ')');
    const firstHeading = (md.match(/^#\s+(.+)$/m) || [])[1];
    document.title = (firstHeading ? firstHeading + ' · ' : '') + 'BK-Lite 技术文档';
    titleEl.textContent = doc;
    el.className = 'md-body';
    el.innerHTML = marked.parse(md);
    // 站内 md 相互跳转：指向阅读页自身
    el.querySelectorAll('a[href$=".md"]').forEach(a => {
      const href = a.getAttribute('href');
      if (!/^https?:/.test(href)) a.href = './docs.html?doc=' + dir + href.replace(/^\.\//, '');
    });
  } catch (e) {
    el.className = 'error';
    el.textContent = '文档加载失败（' + e.message + '）。可直接在仓库中查看：' + doc;
  }
})();
</script>
</body>
</html>
